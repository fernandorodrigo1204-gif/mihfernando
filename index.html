<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa História</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0b14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      max-width: 90%;
      width: 400px;
      padding: 20px;
    }

    /* Efeito de texto brilhante */
    .glow-text {
      font-size: 1.4rem;
      line-height: 1.6;
      margin: 25px 0;
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 182, 193, 0.8),
                   0 0 15px rgba(255, 105, 180, 0.6),
                   0 0 25px rgba(255, 20, 147, 0.4);
      animation: pulse 3s infinite alternate;
    }

    .title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffd1dc;
      text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
      margin-bottom: 30px;
    }

    /* Animação suave do brilho */
    @keyframes pulse {
      0% {
        text-shadow: 0 0 5px rgba(255, 182, 193, 0.7),
                     0 0 10px rgba(255, 105, 180, 0.5);
      }
      100% {
        text-shadow: 0 0 12px rgba(255, 182, 193, 1),
                     0 0 22px rgba(255, 105, 180, 0.9),
                     0 0 35px rgba(255, 20, 147, 0.7);
      }
    }

    .heart {
      font-size: 2.5rem;
      margin-top: 20px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">Nossa História ✨</div>

    <p class="glow-text">Desde que você chegou, cada dia comum ganhou um brilho diferente.</p>
    
    <p class="glow-text">Pequenos momentos ao seu lado se tornaram as minhas melhores memórias.</p>
    
    <p class="glow-text">Obrigado por ser exatamente quem você é e por deixar meu mundo mais bonito.</p>

    <div class="heart">💖</div>
  </div>

</body>
</html>
